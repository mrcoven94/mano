name: quality-smoke
on:
  pull_request:
    paths:
      - "packages/quality/**"
      - "apps/engine/**"
      - "apps/channels/**"
      - "packages/channels/**"
      - "packages/mail/**"
      - "packages/protocol/**"
      - "eval/**"
      - ".github/workflows/quality-*.yml"
permissions:
  contents: read
  pull-requests: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require the model key
        env:
          META_MODEL_API_KEY: ${{ secrets.META_MODEL_API_KEY }}
        run: |
          [ -n "$META_MODEL_API_KEY" ] || { echo "META_MODEL_API_KEY is not set"; exit 1; }
      - name: Judge and serving IDs must differ
        env:
          MANO_MODEL_JUDGE_ID: ${{ vars.MANO_MODEL_JUDGE_ID }}
          MANO_MODEL_BENCH_ID: ${{ vars.MANO_MODEL_BENCH_ID }}
        run: |
          [ -n "$MANO_MODEL_JUDGE_ID" ] || { echo "MANO_MODEL_JUDGE_ID variable is not set"; exit 1; }
          [ -n "$MANO_MODEL_BENCH_ID" ] || { echo "MANO_MODEL_BENCH_ID variable is not set"; exit 1; }
          [ "$MANO_MODEL_JUDGE_ID" != "$MANO_MODEL_BENCH_ID" ] || { echo "judge and serving model IDs must differ"; exit 1; }
      - run: pnpm install --no-frozen-lockfile
      - name: Fetch main baseline
        run: |
          mkdir -p runs
          curl -fsSL "${{ vars.QUALITY_RUNS_URL }}/latest.json" -o runs/baseline.json || echo "no baseline yet"
      - name: Run smoke subset
        env:
          META_MODEL_API_KEY: ${{ secrets.META_MODEL_API_KEY }}
          MANO_MODEL_BASE_URL: ${{ secrets.MANO_MODEL_BASE_URL }}
          MANO_MODEL_JUDGE_ID: ${{ vars.MANO_MODEL_JUDGE_ID }}
          MANO_MODEL_BENCH_ID: ${{ vars.MANO_MODEL_BENCH_ID }}
        run: |
          set -o pipefail
          cd packages/quality
          BASELINE=""
          [ -f ../../runs/baseline.json ] && BASELINE="--baseline ../../runs/baseline.json"
          node src/bin/smoke.ts $BASELINE --out ../../runs/smoke 2>&1 | tee ../../runs/smoke.log
          echo "exit=$?" >> "$GITHUB_ENV"
      - name: Post or update PR comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=""
          [ -f runs/smoke.log ] && BODY=$(sed -n '/## Quality smoke/,$p' runs/smoke.log)
          [ -z "$BODY" ] && BODY="## Quality smoke: error"$'\n\nThe smoke run failed before scoring. See the action log.'
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -q '.[] | select(.body | startswith("## Quality smoke")) | .id' | head -1)
          if [ -n "$EXISTING" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/$EXISTING" -X PATCH -f body="$BODY" --jq .id
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body "$BODY"
          fi
      # Exit 0 is a pass, 1 a failure, 2 neutral (stand-ins, no baseline, or
      # provisional calibration). GitHub has no neutral job outcome from the
      # inside, so neutral fails the job: it must never show green.
      - name: Gate the pull request
        if: env.exit != '0'
        run: exit 1

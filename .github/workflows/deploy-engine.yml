name: deploy-engine
on:
  push:
    branches: [main]
    paths:
      - "apps/engine/**"
      - "packages/protocol/**"
      - ".github/workflows/deploy-engine.yml"
  # Pull requests run only the validate job: lint this workflow and bundle
  # the worker with a dry run. No secrets, no deploy.
  pull_request:
    paths:
      - "apps/engine/**"
      - "packages/protocol/**"
      - ".github/workflows/deploy-engine.yml"
  workflow_dispatch:
permissions:
  contents: read
# Serialize deploys so two pushes cannot deploy over each other. Never cancel: a started deploy runs to the end.
concurrency:
  group: deploy-engine-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint this workflow
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color .github/workflows/deploy-engine.yml
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Bundle the worker without deploying
        run: pnpm exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/engine-dry-run"
        working-directory: apps/engine

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: engine-production
      url: https://engine.withmano.com/health
    defaults:
      run:
        working-directory: apps/engine
    steps:
      - uses: actions/checkout@v7
      - name: Verify required secrets
        run: |
          set -euo pipefail
          missing=0
          check() {
            if [ -z "$1" ]; then echo "::error::missing required secret $2"; missing=1; fi
          }
          check "$CLOUDFLARE_API_TOKEN" CLOUDFLARE_API_TOKEN
          check "$CLOUDFLARE_ACCOUNT_ID" CLOUDFLARE_ACCOUNT_ID
          check "$META_MODEL_API_KEY" META_MODEL_API_KEY
          check "$ENCRYPTION_KEK_B64" ENCRYPTION_KEK_B64
          check "$SESSION_SECRET" SESSION_SECRET
          check "$OPERATOR_SECRET" OPERATOR_SECRET
          check "$MANO_ENGINE_AGENT_TOKEN" MANO_ENGINE_AGENT_TOKEN
          check "$MANO_HANDLE_GRANT_SECRET" MANO_HANDLE_GRANT_SECRET
          check "$MANO_ENGINE_CHANNELS_TOKEN" MANO_ENGINE_CHANNELS_TOKEN
          check "$MANO_CHANNELS_URL" MANO_CHANNELS_URL
          check "$MANO_ENGINE_SEND_SECRET" MANO_ENGINE_SEND_SECRET
          check "$EXECUTOR_MODE" EXECUTOR_MODE
          if [ "$EXECUTOR_MODE" = "sandbox" ]; then check "$SANDBOX_BASE_URL" SANDBOX_BASE_URL; fi
          exit $missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          META_MODEL_API_KEY: ${{ secrets.META_MODEL_API_KEY }}
          ENCRYPTION_KEK_B64: ${{ secrets.ENCRYPTION_KEK_B64 }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          OPERATOR_SECRET: ${{ secrets.OPERATOR_SECRET }}
          MANO_ENGINE_AGENT_TOKEN: ${{ secrets.MANO_ENGINE_AGENT_TOKEN }}
          MANO_HANDLE_GRANT_SECRET: ${{ secrets.MANO_HANDLE_GRANT_SECRET }}
          MANO_ENGINE_CHANNELS_TOKEN: ${{ secrets.MANO_ENGINE_CHANNELS_TOKEN }}
          MANO_CHANNELS_URL: ${{ secrets.MANO_CHANNELS_URL }}
          MANO_ENGINE_SEND_SECRET: ${{ secrets.MANO_ENGINE_SEND_SECRET }}
          EXECUTOR_MODE: ${{ secrets.EXECUTOR_MODE }}
          SANDBOX_BASE_URL: ${{ secrets.SANDBOX_BASE_URL }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
        working-directory: .
      - run: pnpm --filter @mano/engine --filter @mano/protocol run check
        working-directory: .
      - name: Create bucket
        run: pnpm exec wrangler r2 bucket create mano-files || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # One version carries the code and every secret binding, and one
      # deploy activates it, so production never serves a version with
      # partial config, and a rotation never mixes old and new values. The
      # secrets file is built from the environment by jq (values are never
      # printed or put on a command line), lives in the runner's temp dir
      # with mode 600, and is removed when the step ends, pass or fail.
      - name: Deploy code and secrets as one version
        run: |
          set -euo pipefail
          umask 077
          secrets_file="$RUNNER_TEMP/engine-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          jq -n 'env | {
              META_MODEL_API_KEY, ENCRYPTION_KEK_B64, SESSION_SECRET, OPERATOR_SECRET,
              MANO_ENGINE_AGENT_TOKEN, MANO_HANDLE_GRANT_SECRET, MANO_ENGINE_CHANNELS_TOKEN,
              MANO_CHANNELS_URL, MANO_ENGINE_SEND_SECRET, EXECUTOR_MODE,
              SANDBOX_BASE_URL, CF_ACCOUNT_ID, AI_GATEWAY_ID, AI_GATEWAY_PROVIDER, MODEL_ALLOWLIST_EXTRA
            } | with_entries(select(.value != null and .value != ""))' > "$secrets_file"
          pnpm exec wrangler deploy --secrets-file "$secrets_file"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          META_MODEL_API_KEY: ${{ secrets.META_MODEL_API_KEY }}
          ENCRYPTION_KEK_B64: ${{ secrets.ENCRYPTION_KEK_B64 }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          OPERATOR_SECRET: ${{ secrets.OPERATOR_SECRET }}
          MANO_ENGINE_AGENT_TOKEN: ${{ secrets.MANO_ENGINE_AGENT_TOKEN }}
          MANO_HANDLE_GRANT_SECRET: ${{ secrets.MANO_HANDLE_GRANT_SECRET }}
          MANO_ENGINE_CHANNELS_TOKEN: ${{ secrets.MANO_ENGINE_CHANNELS_TOKEN }}
          MANO_CHANNELS_URL: ${{ secrets.MANO_CHANNELS_URL }}
          MANO_ENGINE_SEND_SECRET: ${{ secrets.MANO_ENGINE_SEND_SECRET }}
          EXECUTOR_MODE: ${{ secrets.EXECUTOR_MODE }}
          SANDBOX_BASE_URL: ${{ secrets.SANDBOX_BASE_URL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          AI_GATEWAY_ID: ${{ secrets.AI_GATEWAY_ID }}
          AI_GATEWAY_PROVIDER: ${{ secrets.AI_GATEWAY_PROVIDER }}
          MODEL_ALLOWLIST_EXTRA: ${{ secrets.MODEL_ALLOWLIST_EXTRA }}
      # The custom domain's certificate can take a few minutes on the first
      # deploy, so the check retries for a 200, then requires ok:true.
      - name: Check production health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            status=$(curl -s -o "$RUNNER_TEMP/health.json" -w '%{http_code}' https://engine.withmano.com/health || true)
            if [ "$status" = "200" ]; then
              cat "$RUNNER_TEMP/health.json"
              if jq -e '.ok == true' "$RUNNER_TEMP/health.json" > /dev/null; then exit 0; fi
              echo "::error::engine answers but reports ok:false; a required part is missing"
              exit 1
            fi
            echo "attempt $attempt: HTTP $status"
            sleep 15
          done
          echo "::error::https://engine.withmano.com/health did not return 200"
          exit 1

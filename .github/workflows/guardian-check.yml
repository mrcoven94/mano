name: guardian-check

# Gates guardian pull requests: the Modal app must import under the pinned
# SDK, serve its one authenticated route as a Modal Server (whose requests
# Modal does not store) with no Function taking a check as input, refuse
# blank tokens, strictly parse verdicts, and match its pinned model and image.
on:
  pull_request:
    paths:
      - "packages/guardian/**"
      - ".github/workflows/guardian-check.yml"
  push:
    branches: [main]
    paths:
      - "packages/guardian/**"
      - ".github/workflows/guardian-check.yml"

permissions:
  contents: read

jobs:
  modal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "modal==1.6.2" "fastapi==0.162.0" "httpx==0.28.1" "uvicorn==0.54.0"
      - name: Test the app
        run: python -m unittest discover -s packages/guardian/modal -v
      - name: Import the app and check its shape
        run: |
          python - <<'EOF'
          import json
          import sys
          import urllib.request
          import warnings

          sys.path.insert(0, "packages/guardian/modal")
          warnings.filterwarnings("ignore")
          import modal  # noqa: E402
          import app  # noqa: E402  (must import under the pinned SDK)

          # The route is a Server named check. No web Function, whose
          # requests Modal would keep as inputs, and nothing else deployed
          # but the weight download.
          assert isinstance(app.Guardian, modal.Server), type(app.Guardian)
          assert app.app.registered_web_endpoints == [], (
              app.app.registered_web_endpoints
          )
          assert sorted(app.app.registered_functions) == ["check", "download"], (
              sorted(app.app.registered_functions)
          )
          assert app.app.registered_classes == {}, app.app.registered_classes

          # Blank tokens refuse to start.
          for bad in (None, "", "   "):
              try:
                  app.require_token(bad)
              except RuntimeError:
                  pass
              else:
                  raise AssertionError(f"accepted blank token {bad!r}")
          assert app.require_token("x") == "x"

          # Strict verdict parsing.
          assert app.parse_verdict('{"review":"ok","verdict":"pass","problems":[]}') == {
              "verdict": "pass",
              "problems": [],
          }
          for bad in (
              "nope",
              "[]",
              '{"verdict":"pass","problems":[]}',
              '{"review":null,"verdict":"pass","problems":[]}',
              '{"review":"r","verdict":"maybe","problems":[]}',
              '{"review":"r","verdict":"pass","problems":["x"]}',
              '{"review":"r","verdict":"fix","problems":[]}',
              '{"review":"r","verdict":"block","problems":[]}',
              '{"review":"r","verdict":"block","problems":[1]}',
              '{"review":"r","verdict":"block","problems":[],"verdict":"pass"}',
          ):
              try:
                  app.parse_verdict(bad)
              except ValueError:
                  pass
              else:
                  raise AssertionError(f"accepted bad verdict {bad}")

          # Proxy auth stays on (the Server default), the route has no
          # access log, and nothing sends a check through Modal's input
          # system or stores it.
          source = open("packages/guardian/modal/app.py").read()
          for wanted in (
              "@app.server(",
              "access_log=False",
              "max_concurrency=8",
              "revision=MODEL_REVISION",
              "vllm-openai@{IMAGE_DIGEST}",
          ):
              assert wanted in source, wanted
          assert source.count("revision=MODEL_REVISION") == 2
          for banned in (
              "unauthenticated",
              "fastapi_endpoint",
              "web_server",
              "asgi_app",
              "@modal.method",
              ".remote(",
              ".spawn(",
              ".map(",
              "modal.Dict",
              "modal.Queue",
              "print(",
              "logging",
              "allow_concurrent_inputs",
              "from_registry(IMAGE_TAG)",
              "/invocations",
              "subprocess",
          ):
              assert banned not in source, banned

          # The model pin matches Hugging Face, the image pin Docker Hub.
          with urllib.request.urlopen(
              f"https://huggingface.co/api/models/{app.MODEL_ID}"
          ) as response:
              head = json.load(response)["sha"]
          assert head == app.MODEL_REVISION, (head, app.MODEL_REVISION)
          with urllib.request.urlopen(
              "https://hub.docker.com/v2/repositories/vllm/vllm-openai/tags/v0.32.0"
          ) as response:
              digest = json.load(response)["digest"]
          assert digest == app.IMAGE_DIGEST, (digest, app.IMAGE_DIGEST)

          print("guardian modal app: ok")
          EOF

name: guardian-check

# Gates guardian pull requests: the Modal app must import under the pinned
# SDK, serve its one authenticated route as a Modal Server (whose requests
# Modal does not store) with no Function taking a check as input, refuse
# blank tokens, strictly parse verdicts, and match its pinned model and image.
# Also fails if guardian-modal's triggers, any job's if, or any job's first
# step (a case-sensitive main-only check) differ from an exact allowlist.
# That catches accidental edits on main and in reviewed pull requests; it
# cannot stop a hostile branch, which runs its own copy of both files.
on:
  pull_request:
    paths:
      - "packages/guardian/**"
      - ".github/workflows/guardian-check.yml"
      - ".github/workflows/guardian-modal.yml"
  push:
    branches: [main]
    paths:
      - "packages/guardian/**"
      - ".github/workflows/guardian-check.yml"
      - ".github/workflows/guardian-modal.yml"

permissions:
  contents: read

jobs:
  modal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "modal==1.6.2" "fastapi==0.162.0" "httpx==0.28.1" "uvicorn==0.54.0"
      - name: Test the app
        run: python -m unittest discover -s packages/guardian/modal -v
      - name: guardian-modal's triggers and job guards match the allowlist
        run: |
          pip install "pyyaml==6.0.2"
          python - <<'EOF'
          import copy
          import yaml

          # An exact allowlist, not a parser: any change to the triggers, a
          # job's if, or a job's first step fails until it is copied here in
          # a reviewed pull request. This catches accidental edits only. A
          # hostile branch runs its own copy of both files; the
          # guardian-production environment's branch policy stops that.
          MAIN = "github.ref == 'refs/heads/main'"
          EXPECTED_IF = {
              "deploy": MAIN + " && (github.event_name == 'push' || inputs.target == 'production')",
              "staging": MAIN + " && (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')",
              "stop-staging": MAIN + " && (github.event_name == 'workflow_dispatch' && inputs.target == 'stop-staging')",
              "stop-old": MAIN + " && (github.event_name == 'workflow_dispatch' && inputs.target == 'stop-old')",
          }
          # GitHub's == ignores case, so each job first checks the ref again
          # in the shell, which compares exactly.
          EXPECTED_FIRST_STEP = {
              "name": "Run only on main",
              "run": 'test "$GITHUB_REF" = "refs/heads/main"',
          }
          EXPECTED_ON = {
              "push": {
                  "branches": ["main"],
                  "paths": [
                      "packages/guardian/modal/**",
                      ".github/workflows/guardian-modal.yml",
                  ],
              },
              "workflow_dispatch": {
                  "inputs": {
                      "target": {
                          "description": "Run from main only. production deploys mano-guardian-server; staging deploys main to mano-guardian-staging; stop-staging stops it; stop-old stops the old mano-guardian app after the URL swap",
                          "type": "choice",
                          "options": ["production", "staging", "stop-staging", "stop-old"],
                          "default": "production",
                      },
                      "min_containers": {
                          "description": "Production only. GPU containers kept up: 0 scales to zero, 1 keeps one warm",
                          "type": "choice",
                          "options": ["0", "1"],
                          "default": "0",
                      },
                  }
              },
          }


          def problems(workflow):
              found = []
              triggers = workflow.get("on", workflow.get(True))
              if triggers != EXPECTED_ON:
                  found.append("triggers differ from the allowlist")
              jobs = workflow.get("jobs") or {}
              if set(jobs) != set(EXPECTED_IF):
                  found.append(f"jobs are {sorted(jobs)}, not {sorted(EXPECTED_IF)}")
              for name, job in jobs.items():
                  if job.get("if") != EXPECTED_IF.get(name):
                      found.append(f"job {name} has if {job.get('if')!r}")
                  steps = job.get("steps") or [None]
                  if steps[0] != EXPECTED_FIRST_STEP:
                      found.append(f"job {name} does not start with the main-only step")
              return found


          with open(".github/workflows/guardian-modal.yml") as handle:
              actual = yaml.safe_load(handle)

          # The rule must refuse each known way around it.
          def edited(change):
              workflow = copy.deepcopy(actual)
              change(workflow)
              return workflow

          bypasses = {
              "quoted parentheses": lambda w: w["jobs"]["staging"].update(
                  {"if": MAIN + " && ('(' == '(') || true || (')' == ')')"}
              ),
              "push without branches": lambda w: w[True].update(
                  {"push": {"branches-ignore": ["main"]}}
              ),
              "no case-sensitive step": lambda w: w["jobs"]["deploy"]["steps"].pop(0),
              "or around the main check": lambda w: w["jobs"]["deploy"].update(
                  {"if": MAIN + " || inputs.target == 'production'"}
              ),
              "no if": lambda w: w["jobs"]["stop-old"].pop("if"),
              "extra job": lambda w: w["jobs"].update({"other": {"steps": []}}),
              "pull_request trigger": lambda w: w[True].update({"pull_request": None}),
          }
          for name, change in bypasses.items():
              assert problems(edited(change)), f"allowlist accepted: {name}"

          found = problems(actual)
          assert not found, found
          print(f"guardian-modal: triggers and all {len(EXPECTED_IF)} job guards match the allowlist")
          EOF
      - name: Import the app and check its shape
        run: |
          python - <<'EOF'
          import json
          import sys
          import urllib.request
          import warnings

          sys.path.insert(0, "packages/guardian/modal")
          warnings.filterwarnings("ignore")
          import modal  # noqa: E402
          import app  # noqa: E402  (must import under the pinned SDK)

          # The route is a Server named check. No web Function, whose
          # requests Modal would keep as inputs, and nothing else deployed
          # but the weight download.
          assert isinstance(app.Guardian, modal.Server), type(app.Guardian)
          assert app.app.registered_web_endpoints == [], (
              app.app.registered_web_endpoints
          )
          assert sorted(app.app.registered_functions) == ["check", "download"], (
              sorted(app.app.registered_functions)
          )
          assert app.app.registered_classes == {}, app.app.registered_classes

          # Blank tokens refuse to start.
          for bad in (None, "", "   "):
              try:
                  app.require_token(bad)
              except RuntimeError:
                  pass
              else:
                  raise AssertionError(f"accepted blank token {bad!r}")
          assert app.require_token("x") == "x"

          # Strict verdict parsing.
          assert app.parse_verdict('{"review":"ok","verdict":"pass","problems":[]}') == {
              "verdict": "pass",
              "problems": [],
          }
          for bad in (
              "nope",
              "[]",
              '{"verdict":"pass","problems":[]}',
              '{"review":null,"verdict":"pass","problems":[]}',
              '{"review":"r","verdict":"maybe","problems":[]}',
              '{"review":"r","verdict":"pass","problems":["x"]}',
              '{"review":"r","verdict":"fix","problems":[]}',
              '{"review":"r","verdict":"block","problems":[]}',
              '{"review":"r","verdict":"block","problems":[1]}',
              '{"review":"r","verdict":"block","problems":[],"verdict":"pass"}',
          ):
              try:
                  app.parse_verdict(bad)
              except ValueError:
                  pass
              else:
                  raise AssertionError(f"accepted bad verdict {bad}")

          # Proxy auth stays on (the Server default), the route has no
          # access log, and nothing sends a check through Modal's input
          # system or stores it.
          source = open("packages/guardian/modal/app.py").read()
          for wanted in (
              "@app.server(",
              "access_log=False",
              "max_concurrency=8",
              "revision=MODEL_REVISION",
              "vllm-openai@{IMAGE_DIGEST}",
          ):
              assert wanted in source, wanted
          assert source.count("revision=MODEL_REVISION") == 2
          for banned in (
              "unauthenticated",
              "fastapi_endpoint",
              "web_server",
              "asgi_app",
              "@modal.method",
              ".remote(",
              ".spawn(",
              ".map(",
              "modal.Dict",
              "modal.Queue",
              "print(",
              "logging",
              "allow_concurrent_inputs",
              "from_registry(IMAGE_TAG)",
              "/invocations",
              "subprocess",
          ):
              assert banned not in source, banned

          # The model pin matches Hugging Face, the image pin Docker Hub.
          with urllib.request.urlopen(
              f"https://huggingface.co/api/models/{app.MODEL_ID}"
          ) as response:
              head = json.load(response)["sha"]
          assert head == app.MODEL_REVISION, (head, app.MODEL_REVISION)
          with urllib.request.urlopen(
              "https://hub.docker.com/v2/repositories/vllm/vllm-openai/tags/v0.32.0"
          ) as response:
              digest = json.load(response)["digest"]
          assert digest == app.IMAGE_DIGEST, (digest, app.IMAGE_DIGEST)

          print("guardian modal app: ok")
          EOF

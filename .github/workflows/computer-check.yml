name: computer-check

# Gates the hosted desktop service: the Modal app must import under the
# pinned SDK and pass its tests (session secrets, per-person storage, the
# portal-only network, cleanup). Deploying it stays a maintainer step.
on:
  pull_request:
    paths:
      - "packages/computer/modal/**"
      - ".github/workflows/computer-check.yml"
  push:
    branches: [main]
    paths:
      - "packages/computer/modal/**"
      - ".github/workflows/computer-check.yml"

permissions:
  contents: read

jobs:
  modal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "modal==1.6.2" fastapi
      - name: Test the app
        run: python -m unittest discover -s packages/computer/modal -v

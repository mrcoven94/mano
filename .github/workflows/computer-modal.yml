name: computer-modal

# The only way the hosted desktop service reaches production. Merging to main
# with changes under packages/computer/modal/ redeploys it; it can also be run
# by hand from main. Never run `modal deploy` from a laptop for production.
#
# Needs two secrets in the computer-production environment, set by a maintainer:
#   MODAL_TOKEN_ID, MODAL_TOKEN_SECRET
# The `mano-computer` Modal secret (MANO_COMPUTER_TOKEN, MANO_PROFILE_KEY,
# MANO_PORTAL_ORIGIN) is created once by David and is not managed here.

on:
  push:
    branches: [main]
    paths:
      - "packages/computer/modal/**"
      - ".github/workflows/computer-modal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: computer-modal
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: computer-production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "modal==1.6.2" fastapi
      - name: Test the app
        run: python -m unittest discover -s packages/computer/modal -v
      - name: Deploy the computer service
        run: modal deploy packages/computer/modal/app.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

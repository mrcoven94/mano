# Nightly quality run on main: every suite through the real text line, the
# persona probes, Guardian against production and mail's deadline accuracy,
# recorded with history in R2 (mano-quality for aggregates,
# mano-quality-private for per-case results). After the run is recorded, the
# job goes red when something regressed against the previous baseline.
name: quality-nightly
on:
  schedule:
    - cron: "13 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-nightly
  cancel-in-progress: false
jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # The schedule runs on main. A manual run uses the ref it was started
      # on, so a branch can be checked before it merges; only main promotes
      # the baseline, and a branch run is recorded under branches/<name>/.
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require the model key
        env:
          META_MODEL_API_KEY: ${{ secrets.META_MODEL_API_KEY }}
        run: |
          [ -n "$META_MODEL_API_KEY" ] || { echo "META_MODEL_API_KEY is not set"; exit 1; }
      - name: Judge and serving IDs must differ
        env:
          MANO_MODEL_JUDGE_ID: ${{ vars.MANO_MODEL_JUDGE_ID }}
          MANO_MODEL_BENCH_ID: ${{ vars.MANO_MODEL_BENCH_ID }}
        run: |
          [ -n "$MANO_MODEL_JUDGE_ID" ] || { echo "MANO_MODEL_JUDGE_ID variable is not set"; exit 1; }
          [ -n "$MANO_MODEL_BENCH_ID" ] || { echo "MANO_MODEL_BENCH_ID variable is not set"; exit 1; }
          [ "$MANO_MODEL_JUDGE_ID" != "$MANO_MODEL_BENCH_ID" ] || { echo "judge and serving model IDs must differ"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - name: Restore holdout
        env:
          HOLDOUT: ${{ secrets.MANO_QUALITY_HOLDOUT }}
          HOLDOUT_SHA: ${{ secrets.MANO_QUALITY_HOLDOUT_SHA256 }}
        run: |
          if [ -n "$HOLDOUT" ]; then
            printf '%s' "$HOLDOUT" > "$RUNNER_TEMP/holdout.json"
            echo "MANO_QUALITY_HOLDOUT_PATH=$RUNNER_TEMP/holdout.json" >> "$GITHUB_ENV"
            echo "MANO_QUALITY_HOLDOUT_SHA256=$HOLDOUT_SHA" >> "$GITHUB_ENV"
          else
            echo "no holdout secret; the run is recorded with the holdout marked as not run"
          fi
      - name: Run and record every suite
        working-directory: packages/quality
        env:
          QUALITY_GATE_STRICT: "1"
          META_MODEL_API_KEY: ${{ secrets.META_MODEL_API_KEY }}
          MANO_MODEL_BASE_URL: ${{ secrets.MANO_MODEL_BASE_URL }}
          MANO_MODEL_JUDGE_ID: ${{ vars.MANO_MODEL_JUDGE_ID }}
          MANO_MODEL_BENCH_ID: ${{ vars.MANO_MODEL_BENCH_ID }}
          QUALITY_PRICE_INPUT_PER_1K: ${{ vars.QUALITY_PRICE_INPUT_PER_1K }}
          QUALITY_PRICE_OUTPUT_PER_1K: ${{ vars.QUALITY_PRICE_OUTPUT_PER_1K }}
          MANO_GUARDIAN_URL: ${{ secrets.MANO_GUARDIAN_URL }}
          MANO_GUARDIAN_TOKEN: ${{ secrets.MANO_GUARDIAN_TOKEN }}
          MANO_GUARDIAN_KEY_ID: ${{ secrets.MANO_GUARDIAN_KEY_ID }}
          MANO_GUARDIAN_KEY_SECRET: ${{ secrets.MANO_GUARDIAN_KEY_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          node --import ./src/register.ts src/bin/nightly.ts --out ../../runs-staging --ref "$GITHUB_REF" --upload

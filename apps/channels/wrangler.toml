name = "mano-channels"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

routes = [{ pattern = "text.withmano.com", custom_domain = true }]

[durable_objects]
bindings = [
  { name = "CONVERSATION", class_name = "ConversationDO" },
  { name = "CHANNEL_STATE", class_name = "ChannelStateDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConversationDO", "ChannelStateDO"]

[[queues.producers]]
binding = "EVENTS"
queue = "mano-channel-events"

[[queues.consumers]]
queue = "mano-channel-events"
max_batch_size = 10
max_retries = 5
dead_letter_queue = "mano-channel-events-dlq"

# The dead-letter consumer records the event ID and drops the body, so
# failed events and their message text do not sit in the DLQ forever.
[[queues.consumers]]
queue = "mano-channel-events-dlq"
max_batch_size = 10
max_retries = 0

[[r2_buckets]]
binding = "FILES"
bucket_name = "mano-channel-files"

[triggers]
crons = ["* * * * *"]

[[analytics_engine_datasets]]
binding = "METER"
dataset = "mano_model_usage"

# Secrets (never commit values; set with wrangler secret put):
#   BLOOIO_API_KEY, BLOOIO_CHANNEL_ID, BLOOIO_WEBHOOK_SECRET,
#   MANO_HANDLE_PEPPER, ENCRYPTION_KEK_B64, META_MODEL_API_KEY
# Optional tuning (plain vars or secrets):
#   CF_ACCOUNT_ID, AI_GATEWAY_ID, AI_GATEWAY_PROVIDER,
#   MANO_TEXT_DAILY_BUDGET_USD, MANO_TEXT_USD_PER_1K_CHARS,
#   TURN_BATCH_MS, TURN_INTERIM_MS, BLOOIO_MEDIA_HOSTS,
#   MANO_TEXT_NUMBER (our line's number, checked against channel_address)

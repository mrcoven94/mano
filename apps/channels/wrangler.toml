name = "mano-channels"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

routes = [{ pattern = "text.withmano.com", custom_domain = true }]

[durable_objects]
bindings = [
  { name = "CONVERSATION", class_name = "ConversationDO" },
  { name = "CHANNEL_STATE", class_name = "ChannelStateDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConversationDO", "ChannelStateDO"]

[[queues.producers]]
binding = "EVENTS"
queue = "mano-channel-events"

[[queues.consumers]]
queue = "mano-channel-events"
max_batch_size = 10
max_retries = 5
dead_letter_queue = "mano-channel-events-dlq"

# The dead-letter consumer records the event ID and drops the body, so
# failed events and their message text do not sit in the DLQ forever.
[[queues.consumers]]
queue = "mano-channel-events-dlq"
max_batch_size = 10
max_retries = 0

[[r2_buckets]]
binding = "FILES"
bucket_name = "mano-channel-files"

[triggers]
crons = ["* * * * *"]

# Real texts go only to a Standard model ID, with store: false.
[vars]
MANO_REPLY_MODEL = "muse-spark-1.3"
# Mano's chat background, set once per chat, is off until a version is
# checked on a real iPhone in light and dark mode. Turning it on also needs
# MANO_CHAT_BACKGROUND_URL, an https image we host.
MANO_CHAT_BACKGROUND_ENABLED = "false"
# One switch for every reaction and the eyes; "false" turns them all off.
MANO_REACTIONS_ENABLED = "true"

# Secrets (never commit values; set with wrangler secret put):
#   BLOOIO_API_KEY, BLOOIO_CHANNEL_ID, BLOOIO_WEBHOOK_SECRET,
#   MANO_HANDLE_PEPPER, ENCRYPTION_KEK_B64, META_MODEL_API_KEY
# Optional tuning (plain vars or secrets):
#   CF_ACCOUNT_ID, AI_GATEWAY_ID, AI_GATEWAY_PROVIDER,
#   MANO_TEXT_DAILY_BUDGET_USD, MANO_TEXT_USD_PER_1K_CHARS,
#   TURN_BATCH_MS, TURN_INTERIM_MS, TURN_EYES_AFTER_MS, BLOOIO_MEDIA_HOSTS,
#   MANO_TEXT_NUMBER (our line's number, checked against channel_address)
# Mano's agent (all three set, or turns use the plain model answer):
#   AGENT_URL (plain var, the agent's base URL), and the secrets
#   MANO_AGENT_SECRET (signs agent traffic both ways, shared with the
#   agent) and MANO_HANDLE_GRANT_SECRET (signs per-turn handle grants,
#   shared with the engine, never the agent)
# Engine: MANO_ENGINE_URL, MANO_ENGINE_CHANNELS_TOKEN (stores texted
#   photos in the person's Engine documents and removes a deleted
#   conversation's agent state) and MANO_ENGINE_SEND_SECRET (verifies
#   Engine's reminder deliveries on /internal/agent-send only)

name = "mano-engine"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
# Served only on the custom domain: no workers.dev URL and no preview URLs,
# so the account subdomain is never used.
workers_dev = false
preview_urls = false
routes = [{ pattern = "engine.withmano.com", custom_domain = true }]

[durable_objects]
bindings = [
  { name = "PERSON_AGENT", class_name = "PersonAgent" },
  { name = "ORG_AGENT", class_name = "OrgAgent" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PersonAgent", "OrgAgent"]

[[r2_buckets]]
binding = "FILES"
bucket_name = "mano-files"

# The sandbox portal's MAX_FIELD_LENGTH and MAX_UPLOAD_BYTES
# (apps/sandbox-portal/wrangler.toml). In sandbox mode the gateway refuses
# a filing over these before the approval question. Change both files
# together: test-node/sandbox-portal-limits.test.ts fails when they differ.
[vars]
SANDBOX_MAX_FIELD_LENGTH = "500"
SANDBOX_MAX_UPLOAD_BYTES = "5242880"
# The daily check for new help texts people only when this is "on". It stays off
# until Engine and Channels both run the code that makes its text no replay. To
# stop it later, change this line to "off" and merge: the check keeps running,
# sends nothing, and a text already waiting holds.
MANO_DAILY_CHECK_SENDS = "off"

# Secrets (never commit values):
#   wrangler secret put META_MODEL_API_KEY  (reads from stdin)
#   wrangler secret put ENCRYPTION_KEK_B64
#   wrangler secret put SESSION_SECRET
#   wrangler secret put OPERATOR_SECRET  (marks people synthetic via the admin route)
#   wrangler secret put MANO_ENGINE_AGENT_TOKEN  (the agent's service token)
#   wrangler secret put MANO_HANDLE_GRANT_SECRET  (Channels signs handle grants with it)
#   wrangler secret put MANO_ENGINE_CHANNELS_TOKEN  (Channels' token for the conversation delete)
#   wrangler secret put MANO_ENGINE_SEND_SECRET  (signs reminder sends to Channels' agent-send route)
#   MANO_CHANNELS_URL (Channels' base URL, https://text.withmano.com in production)
#   MANO_NUDGE_TIME (optional, local HH:MM deadline nudges go out, default 10:00)
#   EXECUTOR_MODE (simulated or sandbox), plus SANDBOX_BASE_URL and
#   SANDBOX_PORTAL_TOKEN (the portal's own token) for sandbox
#   MANO_GUARDIAN_URL, MANO_GUARDIAN_TOKEN (optional: Guardian's check
#   endpoint and bearer token; with none of the four set the checker is
#   local rules only), MANO_GUARDIAN_KEY_ID and MANO_GUARDIAN_KEY_SECRET
#   (the Modal proxy key pair the endpoint requires)
# Production sets all of these from the engine-production GitHub
# environment in .github/workflows/deploy-engine.yml.
# Optional model routing (see .dev.vars.example):
#   CF_ACCOUNT_ID, AI_GATEWAY_ID, AI_GATEWAY_PROVIDER, MODEL_ALLOWLIST_EXTRA

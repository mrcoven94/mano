    - region [ref=e128]:
      - generic [ref=e129]:
        - paragraph [ref=e130]: What Mano does
        - heading "One agent for the paperwork in your life." [level=2] [ref=e131]
        - generic [ref=e132]:
          - article [ref=e133]:
            - heading "Apply for help" [level=3] [ref=e135]
            - paragraph [ref=e136]: Benefits, cash assistance, jobs, scholarships and training. Mano finds programs you may qualify for and applies with your approval.
          - article [ref=e137]:
            - heading "Fill out any form" [level=3] [ref=e139]
            - paragraph [ref=e140]: Hand Mano any form, on paper or online. Mano fills it from what you have already shared and shows you the exact version before it goes anywhere.
          - article [ref=e141]:
            - heading "Renew on time" [level=3] [ref=e143]
            - paragraph [ref=e144]: Mano tracks renewal dates, gathers what is needed and prepares the packet early, so a missed date does not end your help.
          - article [ref=e145]:
            - heading "Read your mail" [level=3] [ref=e147]
            - paragraph [ref=e148]: Take a photo of a letter. Mano reads it, says what it asks for and adds every deadline to your list.
          - article [ref=e149]:
            - heading "Wait on hold" [level=3] [ref=e151]
            - paragraph [ref=e152]: Mano waits on hold and calls you when a person picks up. On calls, Mano says it is calling for you and that it is your automated assistant, and says the call is transcribed.
          - article [ref=e153]:
            - heading "Track every deadline" [level=3] [ref=e155]
            - paragraph [ref=e156]: One list of what is due, what was sent and what came back. Mano reminds you before anything is late.
          - article [ref=e157]:
            - heading "Job updates by text" [level=3] [ref=e159]
            - paragraph [ref=e160]: Mano watches for openings that fit, drafts applications and texts you when there is something to approve.
          - article [ref=e161]:
            - heading "Any language" [level=3] [ref=e163]
            - paragraph [ref=e164]: Talk to Mano in the language you use at home. Notices and letters are explained in that language too.

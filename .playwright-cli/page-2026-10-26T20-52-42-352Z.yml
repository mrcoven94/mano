        - generic [ref=e174]:
          - heading "You choose who sees your case" [level=3] [ref=e175]
          - paragraph [ref=e176]: Share a case with one office or one case manager, for one purpose. Your agent and theirs only see what the share covers.
        - generic [ref=e177]:

    - region [ref=f14e128]:
      - generic [ref=f14e129]:
        - paragraph [ref=f14e130]: What Mano does
        - heading "One agent for the paperwork in your life." [level=2] [ref=f14e131]
        - generic [ref=f14e132]:
          - article [ref=f14e133]:
            - heading "Apply for help" [level=3] [ref=f14e135]
            - paragraph [ref=f14e136]: Benefits, cash assistance, jobs, scholarships and training. Mano finds programs you may qualify for and applies with your approval.
          - article [ref=f14e137]:
            - heading "Fill out any form" [level=3] [ref=f14e139]
            - paragraph [ref=f14e140]: Hand Mano any form, on paper or online. Mano fills it from what you have already shared and shows you the exact version before it goes anywhere.
          - article [ref=f14e141]:
            - heading "Renew on time" [level=3] [ref=f14e143]
            - paragraph [ref=f14e144]: Mano tracks renewal dates, gathers what is needed and prepares the packet early, so a missed date does not end your help.
          - article [ref=f14e145]:
            - heading "Read your mail" [level=3] [ref=f14e147]
            - paragraph [ref=f14e148]: Take a photo of a letter. Mano reads it, says what it asks for and adds every deadline to your list.
          - article [ref=f14e149]:
            - heading "Wait on hold" [level=3] [ref=f14e151]
            - paragraph [ref=f14e152]: Mano waits on hold and calls you when a person picks up. On calls, Mano says it is calling for you and that it is your automated assistant, and says the call is transcribed.
          - article [ref=f14e153]:
            - heading "Track every deadline" [level=3] [ref=f14e155]
            - paragraph [ref=f14e156]: One list of what is due, what was sent and what came back. Mano reminds you before anything is late.
          - article [ref=f14e157]:
            - heading "Job updates by text" [level=3] [ref=f14e159]
            - paragraph [ref=f14e160]: Mano watches for openings that fit, drafts applications and texts you when there is something to approve.
          - article [ref=f14e161]:
            - heading "Any language" [level=3] [ref=f14e163]
            - paragraph [ref=f14e164]: Talk to Mano in the language you use at home. Notices and letters are explained in that language too.
    - region [ref=f14e165]:
      - generic [ref=f14e167]:
        - generic [ref=f14e168]:
          - paragraph [ref=f14e169]: You stay in charge
          - heading "Nothing happens without your approval." [level=2] [ref=f14e170]
        - generic [ref=f14e171]:
          - heading "You approve every step" [level=3] [ref=f14e172]
          - paragraph [ref=f14e173]: Every send, call and share shows you the exact document and recipient first. A changed document needs a fresh yes.
        - generic [ref=f14e174]:
          - heading "You choose who sees your case" [level=3] [ref=f14e175]
          - paragraph [ref=f14e176]: Share a case with one office or one case manager, for one purpose. Your agent and theirs only see what the share covers.
        - generic [ref=f14e177]:
          - heading "You can take access back" [level=3] [ref=f14e178]
          - paragraph [ref=f14e179]: Revoke a share at any time. Future access stops at once, and Mano tells you what was already sent.

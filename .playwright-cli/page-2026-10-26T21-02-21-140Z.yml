  - main [ref=f11e20]:
    - generic [ref=f11e22]:
      - paragraph [ref=f11e23]: For nonprofits and case managers
      - heading "Every case manager gets an agent that knows their caseload." [level=1] [ref=f11e25]
      - paragraph [ref=f11e26]: The agent prepares the paperwork, chases the missing documents and keeps every deadline in view. Your team spends its time with people.
      - generic [ref=f11e27]:
        - link "Talk to us" [ref=f11e28] [cursor=pointer]:
          - /url: mailto:organizations@withmano.com?subject=Mano%20for%20our%20team
        - link "See Mano for residents" [ref=f11e29] [cursor=pointer]:
          - /url: /
    - region [ref=f11e30]:
      - generic [ref=f11e31]:
        - paragraph [ref=f11e32]: How it works
        - heading "From caseload to launched program." [level=2] [ref=f11e33]
        - generic [ref=f11e34]:
          - article [ref=f11e35]:
            - paragraph [ref=f11e36]: "01"
            - heading "An agent that knows the caseload" [level=3] [ref=f11e37]
            - paragraph [ref=f11e38]: Each case manager gets an agent loaded with their cases, deadlines and program rules. The agent prepares renewals and applications from the case file and shows the manager the exact draft before anything moves.
          - article [ref=f11e39]:
            - paragraph [ref=f11e40]: "02"
            - heading "Paperwork prepared, documents chased" [level=3] [ref=f11e41]
            - paragraph [ref=f11e42]: When a case needs a pay stub or a signed form, the manager's agent asks the resident's agent. The resident approves the share. The chase happens between agents, and the manager sees status instead of making reminder calls.
          - article [ref=f11e43]:
            - paragraph [ref=f11e44]: "03"
            - heading "Launch a cash assistance program" [level=3] [ref=f11e45]
            - paragraph [ref=f11e46]: Describe the program and give Mano the rules. Mano drafts the application, the evidence list and the notices. Your team reviews and approves, then residents apply through their own Mano.
          - article [ref=f11e47]:
            - paragraph [ref=f11e48]: "04"
            - heading "Extensions residents can turn on" [level=3] [ref=f11e49]
            - paragraph [ref=f11e50]: A marketplace of partner extensions adds services like document scanning or appointment booking. An extension states the exact data it asks for and who pays. The resident turns it on, approves each use and can remove it.
    - region [ref=f11e51]:
      - generic [ref=f11e52]:
        - paragraph [ref=f11e53]: In the week
        - heading "What the agent takes off the list." [level=2] [ref=f11e54]
        - generic [ref=f11e55]:
          - article [ref=f11e56]:
            - heading "Renewals drafted ahead" [level=3] [ref=f11e57]
            - paragraph [ref=f11e58]: The agent sees a renewal coming, pulls the case file and drafts the packet. The manager reviews one draft instead of rebuilding the case.
          - article [ref=f11e59]:
            - heading "Documents chased between agents" [level=3] [ref=f11e60]
            - paragraph [ref=f11e61]: Missing evidence goes out as one clear request to the resident's agent. Replies land in the case file, matched to the requirement.
          - article [ref=f11e62]:
            - heading "Deadlines in one view" [level=3] [ref=f11e63]
            - paragraph [ref=f11e64]: Every case deadline across the caseload, sorted by what is due first, with the owner of the next step named.
          - article [ref=f11e65]:
            - heading "Programs you can launch" [level=3] [ref=f11e66]
            - paragraph [ref=f11e67]: Turn your assistance rules into a working application without hiring engineers or buying a portal.
          - article [ref=f11e68]:
            - heading "Extensions with clear terms" [level=3] [ref=f11e69]
            - paragraph [ref=f11e70]: Each extension in the marketplace states what data it uses and who pays. Residents opt in. Your team sees which extensions a case uses.
          - article [ref=f11e71]:
            - heading "Approvals stay human" [level=3] [ref=f11e72]
            - paragraph [ref=f11e73]: Sends, shares and submissions wait for a named person's approval, bound to the exact document version.
    - region [ref=f11e74]:
      - generic [ref=f11e76]:
        - generic [ref=f11e77]:
          - paragraph [ref=f11e78]: Pricing
          - heading "Priced per seat." [level=2] [ref=f11e79]
          - paragraph [ref=f11e80]: One seat per case manager. Residents never pay to apply, renew or file. Pricing scales with team size and program volume.

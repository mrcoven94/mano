    - region [ref=f17e128]:
      - generic [ref=f17e129]:
        - paragraph [ref=f17e130]: What Mano does
        - heading "One agent for the paperwork in your life." [level=2] [ref=f17e131]
        - generic [ref=f17e132]:
          - article [ref=f17e133]:
            - heading "Apply for help" [level=3] [ref=f17e135]
            - paragraph [ref=f17e136]: Benefits, cash assistance, jobs, scholarships and training. Mano finds programs you may qualify for and applies with your approval.
          - article [ref=f17e137]:
            - heading "Fill out any form" [level=3] [ref=f17e139]
            - paragraph [ref=f17e140]: Hand Mano any form, on paper or online. Mano fills it from what you have already shared and shows you the exact version before it goes anywhere.
          - article [ref=f17e141]:
            - heading "Renew on time" [level=3] [ref=f17e143]
            - paragraph [ref=f17e144]: Mano tracks renewal dates, gathers what is needed and prepares the packet early, so a missed date does not end your help.
          - article [ref=f17e145]:
            - heading "Read your mail" [level=3] [ref=f17e147]
            - paragraph [ref=f17e148]: Take a photo of a letter. Mano reads it, says what it asks for and adds every deadline to your list.
          - article [ref=f17e149]:
            - heading "Wait on hold" [level=3] [ref=f17e151]
            - paragraph [ref=f17e152]: Mano waits on hold and calls you when a person picks up. On calls, Mano says it is calling for you and that it is your automated assistant, and says the call is transcribed.
          - article [ref=f17e153]:
            - heading "Track every deadline" [level=3] [ref=f17e155]
            - paragraph [ref=f17e156]: One list of what is due, what was sent and what came back. Mano reminds you before anything is late.
          - article [ref=f17e157]:
            - heading "Job updates by text" [level=3] [ref=f17e159]
            - paragraph [ref=f17e160]: Mano watches for openings that fit, drafts applications and texts you when there is something to approve.
          - article [ref=f17e161]:
            - heading "Any language" [level=3] [ref=f17e163]
            - paragraph [ref=f17e164]: Talk to Mano in the language you use at home. Notices and letters are explained in that language too.
    - region [ref=f17e165]:
      - generic [ref=f17e167]:
        - generic [ref=f17e168]:
          - paragraph [ref=f17e169]: You stay in charge
          - heading "Nothing happens without your approval." [level=2] [ref=f17e170]
        - generic [ref=f17e171]:
          - heading "You approve every step" [level=3] [ref=f17e172]
          - paragraph [ref=f17e173]: Every send, call and share shows you the exact document and recipient first. A changed document needs a fresh yes.
        - generic [ref=f17e174]:
          - heading "You choose who sees your case" [level=3] [ref=f17e175]
          - paragraph [ref=f17e176]: Share a case with one office or one case manager, for one purpose. Your agent and theirs only see what the share covers.
        - generic [ref=f17e177]:
          - heading "You can take access back" [level=3] [ref=f17e178]
          - paragraph [ref=f17e179]: Revoke a share at any time. Future access stops at once, and Mano tells you what was already sent.
